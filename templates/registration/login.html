{% extends "base.html" %}
{% block title %}Entrar | Controle de Insumos{% endblock %}
{% block content %}
<section class="card login-card">
    <p class="eyebrow">Acesso ao sistema</p>
    <h1>Entrar</h1>
    <p class="form-note">Use o usuário fornecido pelo administrador.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="button primary" type="submit">Entrar</button>
    </form>
</section>
{% endblock %}
